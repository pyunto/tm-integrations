name: Publish to npm and the MCP Registry

# v0.3.4 のようなバージョンタグを push すると、
# テスト → ビルド → npm公開 → MCPレジストリ公開 まで一気に走る。
#
# 認証情報は一切保存していない:
#   - npm        : Trusted Publishing (OIDC)。npm側で信頼するpublisherを一度登録しておく
#   - MCPレジストリ: mcp-publisher login github-oidc
# どちらも GitHub Actions の OIDC トークンで認証するため、シークレット登録は不要。

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing と MCPレジストリOIDCの両方に必要
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted Publishing は npm >= 11.5.1 を要求する。
          # Node 24 は npm 11.19 系を同梱する。Node 22 LTS は npm 10.9 系なので不可。
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # リリースビルドではキャッシュを使わない（npm公式例の指示）
          package-manager-cache: false

      - name: Show npm version
        run: npm --version

      - name: Verify tag matches mcp/package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./mcp/package.json').version")"
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match mcp/package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Verify mcpName matches server.json name
        run: |
          MCP_NAME="$(node -p "require('./mcp/package.json').mcpName")"
          SRV_NAME="$(node -p "require('./server.json').name")"
          echo "mcpName=${MCP_NAME} server.json name=${SRV_NAME}"
          if [ "${MCP_NAME}" != "${SRV_NAME}" ]; then
            echo "::error::mcpName ${MCP_NAME} does not match server.json name ${SRV_NAME}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # dist/ は .gitignore 対象で、CIの新規チェックアウトには存在しない。
      # テストは dist を import するため、ビルドを先に走らせる必要がある。
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm (Trusted Publishing)
        run: npm publish -w @pyunto/tm-mcp --access public

      - name: Sync server.json version to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "${VERSION}" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          jq '{name, version, packages: [.packages[] | {identifier, version}]}' server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
