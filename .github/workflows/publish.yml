name: Publish to npm and the MCP Registry

# v0.3.5 のようなバージョンタグを push すると、
# テスト → ビルド → npm公開 → MCPレジストリ公開 まで一気に走る。
#
# 認証の内訳:
#   - npm        : Trusted Publishing (OIDC)。認証情報の保存は不要。
#                  npm側でパッケージ設定に信頼するpublisherを一度登録しておく。
#   - MCPレジストリ: pyunto.com のドメイン所有証明（HTTP方式）。
#                  登録名が com.pyunto/* のため GitHub OIDC は使えない
#                  （OIDCが与えるのは io.github.* のみ）。
#                  秘密鍵を GitHub Secrets の PYUNTO_MCP_REGISTRY_KEY に登録しておく。

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing に必要
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted Publishing は npm >= 11.5.1 を要求する。
          # Node 24 は npm 11.19 系を同梱する。Node 22 LTS は npm 10.9 系なので不可。
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # リリースビルドではキャッシュを使わない（npm公式例の指示）
          package-manager-cache: false

      - name: Show npm version
        run: npm --version

      - name: Verify tag matches mcp/package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./mcp/package.json').version")"
          echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match mcp/package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Verify mcpName matches server.json name
        run: |
          MCP_NAME="$(node -p "require('./mcp/package.json').mcpName")"
          SRV_NAME="$(node -p "require('./server.json').name")"
          echo "mcpName=${MCP_NAME} server.json name=${SRV_NAME}"
          if [ "${MCP_NAME}" != "${SRV_NAME}" ]; then
            echo "::error::mcpName ${MCP_NAME} does not match server.json name ${SRV_NAME}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # dist/ は .gitignore 対象で、CIの新規チェックアウトには存在しない。
      # テストは dist を import するため、ビルドを先に走らせる必要がある。
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm (Trusted Publishing)
        run: npm publish -w @pyunto/tm-mcp --access public

      - name: Sync server.json version to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "${VERSION}" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          jq '{name, version, packages: [.packages[] | {identifier, version}]}' server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      # レジストリの名前空間が com.pyunto/* になったため、GitHub OIDC は使えない
      # （OIDCが与えるのは io.github.* のみ）。pyunto.com のドメイン所有証明
      # （https://pyunto.com/.well-known/mcp-registry-auth）に対応する秘密鍵で認証する。
      # 鍵は GitHub Secrets の PYUNTO_MCP_REGISTRY_KEY に入っている。
      # コマンドラインに直接展開せず env 経由で渡す。
      - name: Authenticate to the MCP Registry (domain ownership)
        env:
          MCP_REGISTRY_KEY: ${{ secrets.PYUNTO_MCP_REGISTRY_KEY }}
        run: ./mcp-publisher login http --domain pyunto.com --private-key "${MCP_REGISTRY_KEY}"

      - name: Validate server.json
        run: ./mcp-publisher validate

      # npm は publish 直後すぐにはバージョンを公開レジストリに出さない（実測で最大2分）。
      # MCPレジストリは「そのnpmバージョンが実在するか」を検証するため、
      # 待たずに進めると 400 "version '...' was not found" で失敗する。
      - name: Wait until npm surfaces the new version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 30); do
            if curl -fsS -H 'Cache-Control: no-cache' \
                 "https://registry.npmjs.org/@pyunto%2Ftm-mcp?t=$(date +%s)" \
               | jq -e --arg v "${VERSION}" '.versions[$v] != null' > /dev/null; then
              echo "npm now serves ${VERSION} (attempt ${i})"
              exit 0
            fi
            echo "npm does not serve ${VERSION} yet (attempt ${i}/30); sleeping 10s"
            sleep 10
          done
          echo "::error::npm did not surface ${VERSION} within 5 minutes"
          exit 1

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
